name: goreleaser

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Signed build provenance: OIDC token for Sigstore, then store the attestation and its artifact record
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Releases come only from main: the tagged commit must be reachable from origin/main
      - name: Require the tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Binaries too: the README install pipes the archive into tar, so users verify the installed binary
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*/git-remote-gs
